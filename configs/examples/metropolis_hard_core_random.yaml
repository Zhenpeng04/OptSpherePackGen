project:
  name: p0_metropolis_hard_core_random
  description: Moderate-density hard-core random packing using RSA initialization and local Metropolis moves.

structure:
  size_distribution: monodisperse
  spatial_order: hard_core_random

physical:
  mean_diameter: 0.3 um
  packing_fraction: 0.25
  medium_thickness: 2.1 um

domain:
  type: periodic_cube

particles:
  num_particles: auto

size_distribution:
  type: monodisperse

algorithm:
  name: metropolis
  parameters:
    initialization: rsa
    sweeps: 150
    step_size: 0.12
    max_attempts_per_particle: 15000

analysis:
  compute_g2: true
  compute_Sk: true
  bins: 90
  k_max_index: 5

validation:
  tolerance_phi: 1.0e-8
  tolerance_overlap: 1.0e-5

output:
  path: results/p0_metropolis_hard_core_random
  coordinate_unit: um
  formats: [csv, json]

runtime:
  random_seed: 314159
  log_level: info
