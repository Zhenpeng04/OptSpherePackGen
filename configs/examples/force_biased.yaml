project:
  name: p0_force_biased
  description: P0 force-biased dense packing using outer-shell repulsion and diameter-ratio contraction.

structure:
  size_distribution: quasi_monodisperse
  spatial_order: hard_core_random

physical:
  mean_diameter: 0.3 um
  packing_fraction: 0.38
  medium_thickness: 1.8 um

domain:
  type: periodic_cube

particles:
  num_particles: auto

size_distribution:
  type: quasi_monodisperse
  CV_radius: 0.03
  min_radius_factor: 0.90
  max_radius_factor: 1.10

algorithm:
  name: force_biased
  parameters:
    initial_radius_fraction: 0.35
    stages: 24
    relaxation_steps_per_stage: 400
    contraction_rate: 1.0e-3

analysis:
  compute_g2: true
  compute_Sk: true
  bins: 80
  k_max_index: 5

validation:
  tolerance_phi: 1.0e-8
  tolerance_overlap: 1.0e-5

output:
  path: results/p0_force_biased
  coordinate_unit: um
  formats: [csv, json]

runtime:
  random_seed: 314159
  log_level: info
