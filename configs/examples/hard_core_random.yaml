project:
  name: p0_hard_core_random
  description: Sparse hard-core random packing generated by the default low-phi Poisson-disk route.

structure:
  size_distribution: quasi_monodisperse
  spatial_order: hard_core_random

physical:
  mean_diameter: 0.3 um
  packing_fraction: 0.12
  medium_thickness: 2.4 um

domain:
  type: periodic_cube

particles:
  num_particles: auto

size_distribution:
  type: quasi_monodisperse
  CV_radius: 0.03
  min_radius_factor: 0.90
  max_radius_factor: 1.10

algorithm:
  name: default
  parameters:
    max_attempts_per_particle: 10000
    candidates_per_particle: 8
    shell_outer_factor: 1.0

analysis:
  compute_g2: true
  compute_Sk: true
  bins: 80
  k_max_index: 5

validation:
  tolerance_phi: 1.0e-8
  tolerance_overlap: 1.0e-5

output:
  path: results/p0_hard_core_random
  coordinate_unit: um
  formats: [csv, json]

runtime:
  random_seed: 20260517
  log_level: info
