[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spherepackgen"
version = "1.0.0"
description = "Microsphere packing structure generation for optical simulation."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["sphere-packing", "microspheres", "materials", "photonic-media", "simulation"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "PyYAML>=6.0",
  "h5py>=3.8",
  "matplotlib>=3.7",
  "streamlit>=1.40",
]

[project.scripts]
spherepackgen = "spherepackgen.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
]
visualization = [
  "pyvista>=0.43",
]

[project.urls]
Homepage = "https://github.com/Zhenpeng04/OptSpherePackGen"
Issues = "https://github.com/Zhenpeng04/OptSpherePackGen/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"spherepackgen.examples" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
