name: Release packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag
        required: true
        default: v1.0.0
        type: string

permissions:
  contents: read

jobs:
  packages:
    name: Build and attach release downloads
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check release version
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["RELEASE_TAG"] != "v" + version:
              raise SystemExit("Release tag must match the package version")
          PY
      - name: Build installation packages and source archive
        run: |
          python -m pip install build
          python -m build
          git archive --format=zip --output="dist/OptSpherePackGen-${RELEASE_TAG#v}-source.zip" HEAD
          cd dist
          sha256sum *.whl *.tar.gz *-source.zip > "SHA256SUMS-${RELEASE_TAG#v}.txt"
      - name: Attach downloads to the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/*-source.zip dist/SHA256SUMS-*.txt --repo "$GITHUB_REPOSITORY" --clobber
